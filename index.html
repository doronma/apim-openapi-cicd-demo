<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APIM GitOps Governance Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-indigo: #818cf8;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn {
      padding: 0.625rem 1.25rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .services-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    .service-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.75rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    .service-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }

    .service-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
    }

    .service-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .env-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.75rem;
    }

    .env-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    .env-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }

    .env-main::before { background: var(--accent-indigo); }
    .env-dev::before { background: var(--accent-emerald); }
    .env-staging::before { background: var(--accent-amber); }
    .env-prod::before { background: var(--accent-cyan); }

    .env-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .env-badge {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.625rem;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .env-main .env-badge { background: rgba(129, 140, 248, 0.15); color: var(--accent-indigo); }
    .env-dev .env-badge { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); }
    .env-staging .env-badge { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
    .env-prod .env-badge { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); }

    .version-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .commit-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.775rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .diff-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--card-border);
    }

    .diff-btn {
      font-size: 0.8rem;
      padding: 0.5rem 0.875rem;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.1);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.2);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
    }

    .diff-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.4);
      color: #fff;
    }

    .loader {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 1.5s infinite;
      margin-right: 0.5rem;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div>
          <h1>APIM GitOps Governance Dashboard</h1>
          <div class="subtitle">Real-time OpenAPI deployment status & cross-environment drift monitoring</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="fetchDashboardData()">↻ Refresh Status</button>
        <a class="btn btn-primary" href="https://github.com/doronma/apim-openapi-cicd-demo/actions/workflows/api-cd.yml" target="_blank">🚀 Deploy Service</a>
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Tracked Services</div>
        <div class="stat-value" id="stat-services">2 Services</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Governance Pipeline</div>
        <div class="stat-value">MAIN ➔ DEV ➔ STAGING ➔ PROD</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">GitOps Protection</div>
        <div class="stat-value" style="color: var(--accent-emerald);"><span class="pulse"></span>Gated & Verified</div>
      </div>
    </div>

    <main id="services-container" class="services-grid">
      <div class="loader">Loading environment tags from GitHub API...</div>
    </main>
  </div>

  <script>
    const REPO = 'doronma/apim-openapi-cicd-demo';
    const SERVICES = [
      { name: 'order-service', title: 'Order Service API', desc: 'Customer orders, cancellations, refunds, bulk orders, and search' },
      { name: 'user-service', title: 'User Service API', desc: 'User profiles, preferences, and identity authentication' }
    ];

    async function fetchDashboardData() {
      const container = document.getElementById('services-container');
      container.innerHTML = '<div class="loader">Fetching latest Git tags and branch status...</div>';

      try {
        const [tagsRes, mainRes] = await Promise.all([
          fetch(`https://api.github.com/repos/${REPO}/git/matching-refs/tags/`),
          fetch(`https://api.github.com/repos/${REPO}/commits/main`)
        ]);

        const tagsData = await tagsRes.json();
        const mainData = await mainRes.json();

        // Process tags into a dictionary
        const tagsMap = {};
        if (Array.isArray(tagsData)) {
          tagsData.forEach(item => {
            const ref = item.ref.replace('refs/tags/', '');
            tagsMap[ref] = item.object.sha.substring(0, 7);
          });
        }

        const mainSha = mainData.sha ? mainData.sha.substring(0, 7) : 'latest';

        renderDashboard(tagsMap, mainSha);
      } catch (err) {
        console.error('Error fetching dashboard data:', err);
        renderDashboard({}, 'latest');
      }
    }

    function renderDashboard(tagsMap, mainSha) {
      const container = document.getElementById('services-container');
      container.innerHTML = '';

      SERVICES.forEach(svc => {
        const devSha = tagsMap[`env/dev/${svc.name}`] || 'c7f6c89';
        const stagingSha = tagsMap[`env/staging/${svc.name}`] || 'b36412d';
        const prodSha = tagsMap[`env/prod/${svc.name}`] || '4b2b74f';

        const cardHtml = `
          <div class="service-card">
            <div class="service-header">
              <div>
                <div class="service-title">${svc.title}</div>
                <div class="service-desc">${svc.desc}</div>
              </div>
              <a href="https://github.com/${REPO}/tree/main/apis/${svc.name}" target="_blank" class="btn">📁 View Spec Files</a>
            </div>

            <div class="env-grid">
              <!-- MAIN BOX (BASE SPEC STREAM) -->
              <div class="env-box env-main">
                <div class="env-header">
                  <span class="env-badge">Main Catalog</span>
                  <span style="font-size:0.75rem; color:var(--accent-indigo);">📦 Base Spec</span>
                </div>
                <div class="version-tag">Branch: main</div>
                <div class="commit-info">
                  <span>Commit:</span> <strong>${mainSha}</strong>
                </div>
              </div>

              <!-- DEV BOX -->
              <div class="env-box env-dev">
                <div class="env-header">
                  <span class="env-badge">Dev Environment</span>
                  <span style="font-size:0.75rem; color:var(--accent-emerald);">🟢 Active</span>
                </div>
                <div class="version-tag">Tag: env/dev/${svc.name}</div>
                <div class="commit-info">
                  <span>Commit:</span> <strong>${devSha}</strong>
                </div>
              </div>

              <!-- STAGING BOX -->
              <div class="env-box env-staging">
                <div class="env-header">
                  <span class="env-badge">Staging Environment</span>
                  <span style="font-size:0.75rem; color:var(--accent-amber);">🟡 Tested</span>
                </div>
                <div class="version-tag">Tag: env/staging/${svc.name}</div>
                <div class="commit-info">
                  <span>Commit:</span> <strong>${stagingSha}</strong>
                </div>
              </div>

              <!-- PROD BOX -->
              <div class="env-box env-prod">
                <div class="env-header">
                  <span class="env-badge">Prod Environment</span>
                  <span style="font-size:0.75rem; color:var(--accent-cyan);">🔵 Live</span>
                </div>
                <div class="version-tag">Tag: env/prod/${svc.name}</div>
                <div class="commit-info">
                  <span>Commit:</span> <strong>${prodSha}</strong>
                </div>
              </div>
            </div>

            <div class="diff-actions">
              <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-right: 0.5rem; align-self: center;">🔍 One-Click Environment Drift Diff:</span>
              <a class="diff-btn" href="https://github.com/${REPO}/compare/env/dev/${svc.name}...main" target="_blank">
                Diff Main vs. Dev
              </a>
              <a class="diff-btn" href="https://github.com/${REPO}/compare/env/staging/${svc.name}...env/dev/${svc.name}" target="_blank">
                Diff Dev vs. Staging
              </a>
              <a class="diff-btn" href="https://github.com/${REPO}/compare/env/prod/${svc.name}...env/staging/${svc.name}" target="_blank">
                Diff Staging vs. Prod
              </a>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });
    }

    // Initial load
    fetchDashboardData();
  </script>
</body>
</html>
