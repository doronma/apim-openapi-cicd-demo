name: API CI - Lint & Validate

on:
  push:
    branches:
      - main
    paths:
      - 'apis/**'
      - '.spectral.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'apis/**'
      - '.spectral.yaml'

jobs:
  detect-changes:
    name: Detect Changed API Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Changed Services
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "apis/order-service/openapi.yaml apis/user-service/openapi.yaml")
          fi
          SERVICES=$(echo "$CHANGED_FILES" | grep '^apis/' | cut -d'/' -f2 | sort -u | jq -R . | jq -s -c .)
          echo "Detected changed API services: $SERVICES"
          if [ "$SERVICES" == "[]" ] || [ "$SERVICES" == "" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "matrix=[\"order-service\", \"user-service\"]" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "matrix=$SERVICES" >> $GITHUB_OUTPUT
          fi

  lint-and-validate:
    name: Lint & Validate Specs
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch All Git Tags
        run: git fetch --tags origin || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Spectral CLI
        run: |
          npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI Spec (Spectral)
        run: |
          echo "🔍 Linting apis/${{ matrix.service }}/openapi.yaml..."
          spectral lint apis/${{ matrix.service }}/openapi.yaml --ruleset .spectral.yaml

      - name: Check Schema Integrity
        run: |
          echo "✅ Validating OpenAPI Schema syntax..."
          spectral lint apis/${{ matrix.service }}/openapi.yaml

      - name: Install oasdiff CLI
        run: |
          echo "📥 Installing oasdiff for breaking change detection..."
          mkdir -p $HOME/.local/bin
          curl -fsSL https://raw.githubusercontent.com/tufin/oasdiff/main/install.sh | INSTALL_DIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Detect Breaking Changes (oasdiff)
        run: |
          PROD_TAG="env/prod/${{ matrix.service }}"
          SPEC_PATH="apis/${{ matrix.service }}/openapi.yaml"

          echo "🔍 Checking for breaking API changes against Production baseline..."
          if git rev-parse "$PROD_TAG" >/dev/null 2>&1; then
            echo "📌 Production baseline tag '$PROD_TAG' found."
            $HOME/.local/bin/oasdiff breaking "$PROD_TAG:$SPEC_PATH" "$SPEC_PATH" --fail-on ERR
            echo "✅ No ERR-level breaking changes detected against Production!"
          elif git rev-parse origin/main >/dev/null 2>&1 && [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "⚠️ Production baseline tag '$PROD_TAG' not found. Comparing against 'origin/main'..."
            $HOME/.local/bin/oasdiff breaking "origin/main:$SPEC_PATH" "$SPEC_PATH" --fail-on ERR || true
            echo "✅ Baseline comparison completed."
          else
            echo "ℹ️ No Production baseline tag ($PROD_TAG) found yet. Skipping breaking change comparison."
          fi
