openapi: 3.0.3
info:
  title: Order Service API
  description: API for managing customer orders, cancellations, refunds, and status updates
  version: 1.2.0
paths:
  /orders:
    get:
      summary: List all orders
      operationId: listOrders
      tags:
        - Orders
      parameters:
        - name: limit
          in: query
          description: Maximum number of orders to return
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      summary: Create a new order
      operationId: createOrder
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{orderId}:
    get:
      summary: Get order details by ID
      operationId: getOrderById
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique identifier of the order
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
    delete:
      summary: Delete an order by ID
      operationId: deleteOrderById
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique identifier of the order to delete
          schema:
            type: string
      responses:
        '204':
          description: Order deleted successfully
  /orders/{orderId}/status:
    get:
      summary: Get order status by ID
      operationId: getOrderStatus
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique identifier of the order
          schema:
            type: string
      responses:
        '200':
          description: Order status details
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                    example: ord_12345
                  status:
                    type: string
                    example: PROCESSING
  /orders/{orderId}/cancel:
    post:
      summary: Cancel an order by ID
      operationId: cancelOrder
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique identifier of the order to cancel
          schema:
            type: string
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{orderId}/refund:
    post:
      summary: Request a refund for an order
      operationId: refundOrder
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique identifier of the order to refund
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: Item arrived damaged
      responses:
        '200':
          description: Refund request processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  refundId:
                    type: string
                    example: ref_98765
                  status:
                    type: string
                    example: REFUNDED
components:
  schemas:
    Order:
      type: object
      required:
        - id
        - status
        - amount
      properties:
        id:
          type: string
          example: ord_12345
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, CANCELLED, REFUNDED]
          example: PENDING
        amount:
          type: number
          format: float
          example: 99.99
    NewOrder:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: float
          example: 99.99
